# Build arguments for Docker Bake.
#
# Task sources this file via dotenv and forwards every variable to Bake as
# --set *.args.<KEY>=<VALUE>, making each entry available as a Docker ARG in
# both Dockerfiles.
#
# The version is managed by Renovate. The comment above the entry is a Renovate
# manager annotation: datasource selects the version feed and depName identifies
# the package.
#
# The Alpine and Debian versions this image builds on are NOT pinned here — they
# are owned by the base images (ghcr.io/pyck-ai/baseimages/base:alpine|debian)
# and arrive with each scheduled rebuild.

# renovate: datasource=github-releases depName=flutter/flutter
FLUTTER_VERSION=3.38.1
