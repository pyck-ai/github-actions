# Build arguments for Docker Bake.
#
# Task sources this file via dotenv and forwards every variable to Bake as
# --set *.args.<KEY>=<VALUE>, making each entry available as a Docker ARG in
# the Dockerfile.
#
# The versions are managed by Renovate. The comment above each entry is a
# Renovate manager annotation: datasource selects the version feed and
# depName identifies the package.
#
# The all-in-one base this image builds on is NOT pinned here — it is tracked
# as a floating tag (see the `all-in-one` context in docker-bake.hcl) and
# arrives with each scheduled build of ghcr.io/pyck-ai/baseimages/all-in-one.

# GitHub deprecates runner versions server-side; a stale pin crash-loops every
# runner pod with "Runner version vX is deprecated and cannot receive messages".
# renovate: datasource=github-releases depName=actions/runner
ACTIONS_RUNNER_VERSION=2.337.0

# renovate: datasource=github-releases depName=moby/buildkit
BUILDKIT_VERSION=0.33.0
