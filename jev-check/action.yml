name: jev-check
description: >-
  Runs TypeSafe's jev CLI (`jev check`) over a batch of prepared inputs, in
  Docker, with only an OpenRouter key (no GitHub credentials, no assumption
  about what produced the inputs or what reads the outputs). Given a
  directory of one JSON input per file, it writes each input's result (or
  its failure) to its own output file, so a caller job can prepare inputs
  however it likes and a later job can read results however it likes.
inputs:
  input-dir:
    description: >-
      Directory of `*.json` files, each a complete `jev check -j` input
      object: `{"context": string, "propositions": [string, ...]}`. Mounted
      read-only; an empty directory (or one with no `*.json` files) is not
      an error, since there is simply nothing to check.
    required: true
  output-dir:
    description: >-
      Directory to write results to; created if missing. For each input
      `X.json`, writes `X.json` (jev's `-o json` stdout) on success, or
      `X.error` (jev's stderr plus its exit code) on failure, and continues
      with the next file either way.
    required: true
  openrouter-api-key:
    description: >-
      OpenRouter API key for the jev CLI; pass
      `${{ secrets.OPENROUTER_API_KEY }}`. Passed into the container by
      name only, never as a command-line value, so it never appears in
      `docker inspect` or a process listing on the runner host.
    required: true
  jev-ref:
    description: >-
      go-installable ref of github.com/pyck-ai/jev-cli/cmd/jev. Defaults to
      a commit pin: jev-cli has no tagged releases yet, so this default
      should move to a tag once one exists.
    required: false
    default: f96cc157e45ba0997df0e8897aabd50ce09cbe2e
runs:
  using: composite
  steps:
    # Pass inputs via `env:`, not interpolated into `run:`'s command text,
    # for the same reason verify-image does: a value substituted directly
    # into the run script's text could break out of the surrounding shell
    # quoting. Routing it through `env:` has GitHub Actions write it into
    # the environment safely; the run.sh variables below are normal bash
    # variable expansions, immune to whatever the value contains.
    - name: Run jev check over input-dir
      shell: bash
      env:
        INPUT_DIR: ${{ inputs.input-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        JEV_REF: ${{ inputs.jev-ref }}
      run: '"$GITHUB_ACTION_PATH/run.sh" "$INPUT_DIR" "$OUTPUT_DIR" "$OPENROUTER_API_KEY" "$JEV_REF"'
