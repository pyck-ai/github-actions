name: jev-check
description: >-
  Runs TypeSafe's jev CLI (`jev check` or `jev ask`, see the `command`
  input) over a batch of prepared inputs, from
  a prebuilt org image, with only an OpenRouter key (no GitHub credentials,
  no assumption about what produced the inputs or what reads the outputs).
  Given a directory of one JSON input per file, it writes each input's result
  (or its failure) to its own output file, so a caller job can prepare inputs
  however it likes and a later job can read results however it likes.

  jev comes from `ghcr.io/pyck-ai/jev-cli`, a static single-binary image that
  jev-cli's own pipeline builds, verifies, and publishes. This action builds
  nothing and installs no toolchain: the runner only needs bash and docker.
  The image reference is pinned by digest (the `image` input's default below),
  and Renovate keeps that digest current through the custom regex manager in
  this repo's .github/renovate.json5, which matches the `# renovate:`
  annotation directly above the default.
inputs:
  input-dir:
    description: >-
      Directory of `*.json` files, each a complete `jev -j` input object for
      the chosen `command`: `{"context": string, "propositions": [string,
      ...]}` for `check`, `{"state": ..., "questions": {...}}` for `ask`.
      Each file is fed to jev on stdin; an empty directory (or one with no
      `*.json` files) is not an error, since there is simply nothing to run.
    required: true
  output-dir:
    description: >-
      Directory to write results to; created if missing. For each input
      `X.json`, writes `X.json` (jev's `-o json` stdout) on success, or
      `X.error` (jev's stderr plus its exit code) on failure, and continues
      with the next file either way. Exit status 0 (success) and 1 (`check`
      only: some proposition needs review) are both successes, because both
      print a complete JSON result; any other status is a failure.
    required: true
  command:
    description: >-
      Which jev tool runs on each input file: `check` (default; each file is
      a `jev check -j` object `{context, propositions}`) or `ask` (each file
      is a `jev ask -j` object `{state, questions}`). Any other value fails
      the step before anything is pulled or written.
    required: false
    default: check
  openrouter-api-key:
    description: >-
      OpenRouter API key for the jev CLI; pass the caller's
      OPENROUTER_API_KEY secret. Passed into the container by
      name only, never as a command-line value, so it never appears in
      `docker inspect` or a process listing on the runner host.
    required: true
  image:
    description: >-
      jev container image reference. Defaults to the digest-pinned
      `ghcr.io/pyck-ai/jev-cli` image; the tag (`latest`) is only a
      human-readable hint, the digest is what Docker resolves. Renovate bumps
      the digest in this default. Override only to test another build of the
      image.
    required: false
    # renovate: datasource=docker depName=ghcr.io/pyck-ai/jev-cli
    default: ghcr.io/pyck-ai/jev-cli:latest@sha256:4ea6ea5cb38cca76445c016651f63a5ac56f9ee55e3760b318a2eefad4d27492
runs:
  using: composite
  steps:
    # Pass inputs via `env:`, not interpolated into `run:`'s command text,
    # for the same reason verify-image does: a value substituted directly
    # into the run script's text could break out of the surrounding shell
    # quoting. Routing it through `env:` has GitHub Actions write it into
    # the environment safely; the run.sh variables below are normal bash
    # variable expansions, immune to whatever the value contains.
    - name: Run jev over input-dir
      shell: bash
      env:
        INPUT_DIR: ${{ inputs.input-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        IMAGE: ${{ inputs.image }}
        COMMAND: ${{ inputs.command }}
      run: '"$GITHUB_ACTION_PATH/run.sh" "$INPUT_DIR" "$OUTPUT_DIR" "$OPENROUTER_API_KEY" "$IMAGE" "$COMMAND"'
