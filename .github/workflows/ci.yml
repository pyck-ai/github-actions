name: ci
run-name: CI

# Runs on every pull request and on every push to main so branch protection
# always has a fresh status check to gate on.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (PR head or main); nothing here
# publishes anything, so an in-flight run can always be safely replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No default token scope. Every job below declares exactly what it needs.
permissions: {}

jobs:
  ci:
    # Only needs to read the checked-out source: the Taskfile's `ci` task runs
    # lint, format check, tsc, the tests and the committed-bundle check, and
    # never writes anything back to the repo. The checks live in Taskfile.yml
    # so a contributor runs exactly what CI runs with `task ci`.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"

      # ubuntu-latest does not ship go-task (of our pools, only self-hosted-kata does).
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          repo-token: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Run the CI checks
        run: task ci

  # Aggregate check for branch protection: a single required status that
  # fails if any of the jobs above failed, was cancelled, or was skipped.
  gate:
    if: always()
    needs: [ci]
    # Only inspects job results from the GitHub context; touches no repo
    # content and no packages.
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
