name: ci
run-name: CI

# Runs on every pull request and on every push to main so branch protection
# always has a fresh status check to gate on.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (PR head or main) — nothing here
# publishes anything, so an in-flight run can always be safely replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No default token scope. Every job below declares exactly what it needs.
permissions: {}

jobs:
  lint:
    # Only needs to read the checked-out source to run eslint/prettier.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    # Only needs to read the checked-out source to run tsc --noEmit.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

  test:
    # Only needs to read the checked-out source to run the test suite.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    # Only needs to read the checked-out source; this job never writes
    # anything back to the repo, it only diffs the rebuild against what
    # is already committed.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The bundled-action distribution model (see repo README) commits the
      # ncc-bundled output under dist/ so consuming workflows can reference
      # this repo's actions by SHA with no registry fetch at run time. If the
      # committed dist/ ever drifts from source, a pinned consumer silently
      # runs stale code with no error anywhere — this is the single worst
      # failure mode of that pattern, so CI rebuilds the bundles from a clean
      # checkout and fails on any difference, tracked or untracked.
      #
      # verify-image is a plain-bash composite action (no node bundle, no
      # dist/) since it now just runs an image's own verify.sh via docker
      # run — only ghcr-tidy still bundles.
      #
      # A configured path that no longer exists is a hard failure here, not
      # a silent pass: `git diff --exit-code` and `git status --porcelain`
      # both succeed vacuously against a missing path, so a check that only
      # ran those two would go blind exactly when a bundled action's dist/
      # is deleted, staying green while asserting nothing.
      - name: Rebuild bundles and check dist/ is up to date
        run: |
          npm run bundle
          known_dists=".github/actions/ghcr-tidy/dist"
          for dist in $known_dists; do
            if [ ! -d "$dist" ]; then
              echo "::error::$dist/ does not exist — update this check (it no longer matches the repo's bundled actions)" >&2
              exit 1
            fi
            if ! git diff --exit-code -- "$dist/"; then
              echo "::error::$dist/ is stale — run \"npm run bundle\" and commit the result" >&2
              exit 1
            fi
            if [ -n "$(git status --porcelain -- "$dist/")" ]; then
              echo "::error::$dist/ has untracked output — run \"npm run bundle\" and commit the result" >&2
              exit 1
            fi
          done
          # Catch the opposite drift too: a dist/ this check doesn't know
          # about yet (e.g. a new bundled action) must not slip past unseen.
          for found in .github/actions/*/dist; do
            [ -d "$found" ] || continue
            case " $known_dists " in
              *" $found "*) ;;
              *)
                echo "::error::$found/ exists but isn't checked by this workflow — add it to known_dists above" >&2
                exit 1
                ;;
            esac
          done

  # Aggregate check for branch protection: a single required status that
  # fails if any of the jobs above failed, was cancelled, or was skipped.
  gate:
    if: always()
    needs: [lint, typecheck, test, build]
    # Only inspects job results from the GitHub context; touches no repo
    # content and no packages.
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
