name: ci
run-name: CI

# Runs on every pull request and on every push to main so branch protection
# always has a fresh status check to gate on.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (PR head or main); nothing here
# publishes anything, so an in-flight run can always be safely replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No default token scope. Every job below declares exactly what it needs.
permissions: {}

jobs:
  ci:
    # Only needs to read the checked-out source: the Taskfile's `check` task runs
    # lint, format check, tsc, the tests and the committed-bundle check, and
    # never writes anything back to the repo. The checks live in Taskfile.yml
    # so a contributor runs the same with `task check`, or all of CI with `task ci`.
    permissions:
      contents: read
    # Lint, tsc and 500+ tests: the standard pool.
    runs-on: [pyck-ai, firecracker, standard]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"

      # `task` comes from the runner image (baseimages pins its version).
      - name: Install dependencies
        run: npm ci

      - name: Run the checks
        run: task check

  # Both run the shared actions of this repo (`task zizmor`, `task gitleaks`),
  # which install the pinned tool binary and then run the task. They are two
  # jobs, not steps of `ci`, so a finding is attributed to its own check.
  zizmor:
    permissions:
      contents: read
    runs-on: [pyck-ai, firecracker, light]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan workflows and actions
        uses: ./zizmor

  gitleaks:
    permissions:
      contents: read
    runs-on: [pyck-ai, firecracker, light]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history for secrets
        uses: ./gitleaks

  # Aggregate check for branch protection: the one required status, named
  # `ci-success` after its group. It fails if any job it needs failed or was
  # cancelled; a skipped job passes. The logic is this repo's own ./gate action.
  ci-success:
    if: always()
    needs: [ci, zizmor, gitleaks]
    # The only content it reads is the ./gate action itself, which the local
    # `uses:` path needs a checkout for.
    permissions:
      contents: read
    runs-on: [pyck-ai, firecracker, light]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check all required jobs succeeded
        uses: ./gate
        with:
          needs: ${{ toJSON(needs) }}
