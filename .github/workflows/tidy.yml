name: tidy
run-name: Tidy repo

# Dogfoods this repo's own reusable workflows: housekeeping (delete old
# workflow runs, close stale issues/PRs, delete stale branches) and GHCR
# retention. Every consumer of tidy-repo.yml/tidy-ghcr.yml wires them up
# like this; the provider should too. This repo publishes no container
# images (see `.ghcr-tidy.yaml`'s own header), so the tidy-ghcr job always
# plans/applies against zero packages: it proves the workflow's wiring and
# token permissions on every run, never its deletion path.
on:
  schedule:
    # Daily. Neither ci.yml nor release.yml (nor any other workflow in this
    # repo) declares a `schedule:` trigger, so there is nothing to collide
    # with here — this slot is picked purely to avoid the round-hour stampede
    # of crons that fire across GitHub at :00.
    - cron: "17 5 * * *"
  workflow_dispatch:

# Required by tidy-repo.yml's own contract (see its header comment and this
# repo's README): the callee deliberately declares no concurrency block of
# its own, because inside a called workflow `github.workflow` resolves to
# the CALLER's name — a duplicate block would compute the same group and
# GitHub would kill the run with zero jobs. `cancel-in-progress: false`
# because a half-finished cleanup is worse than none.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tidy:
    name: Tidy repo
    uses: ./.github/workflows/tidy-repo.yml
    # Union of the permissions tidy-repo.yml's three jobs declare:
    # clean-old-workflow-runs needs actions: write,
    # clean-stale-issues-and-prs needs issues: write and pull-requests: write,
    # clean-stale-branches needs contents: write and pull-requests: read
    # (write already covers the read here, so pull-requests: write suffices
    # for both jobs).
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: write
    secrets: inherit
    # No inputs: the declared defaults (30-day workflow-run retention,
    # 30/7-day issue and PR stale/close, 90-day branch retention) suit a
    # small, young, public repo. Renovate branches close their own PRs on
    # merge/superseding, so 90 days of inactivity before deletion is not
    # tight; and 30/7-day stale handling gives outside contributors a fair
    # window before an issue or PR gets closed. Not overridden.

  tidy-ghcr:
    name: Tidy GHCR
    uses: ./.github/workflows/tidy-ghcr.yml
    # Matches tidy-ghcr.yml's own job permissions (contents: read,
    # packages: write, issues: write); see that file for what each is for.
    permissions:
      contents: read
      packages: write
      issues: write
    secrets: inherit
    # No inputs: `.ghcr-tidy.yaml` (packages: []) and the workflow's own
    # defaults are enough. On the daily `schedule` trigger tidy-ghcr.yml
    # forces `apply` on regardless of `inputs.apply` (see its
    # `apply-effective` step): harmless here since there is never
    # anything to delete, and this is precisely what dogfoods the apply
    # path (breaker check, canary skip, volume alarm) end to end with zero
    # risk. A manual `workflow_dispatch` run defaults to `apply: false`
    # (plan-only), which is what proves the token/permissions wiring
    # without exercising the delete path at all.
