name: build-image

# Reusable single-image build/verify/publish workflow.
#
# Shape (must not be weakened): discover -> build+verify (matrix; each leg
# pushes BY DIGEST, no tags, then verifies the exact digest(s) it just
# pushed) -> publish (applies tags) -> gate. The property being protected: a
# bad image never gets the chance to be reachable by a floating tag. Do not
# add a mode/input that allows tagging before every leg's verify step
# completes.
#
# Triggers stay in the caller (schedule / workflow_dispatch / pull_request) —
# a shared workflow must not own the cron, since the offset encodes a real
# dependency on when an upstream image publishes.

on:
  workflow_call:
    secrets:
      # Optional: enables the Docker Hub login step in `build` so callers
      # whose Dockerfiles pull Hub base images (e.g. alpine, debian, golang,
      # nginxinc/nginx-unprivileged) avoid anonymous-pull rate limiting. A
      # caller that omits both simply never logs in. Names are UPPER_SNAKE so
      # a caller's `secrets: inherit` matches them by name.
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    inputs:
      registry:
        description: >-
          Container registry + namespace to build args resolve against and
          to push images to (e.g. ghcr.io/pyck-ai). Exported as the
          REGISTRY env var consumed by the bake file.
        type: string
        required: false
        default: ghcr.io/pyck-ai
      builder-name:
        description: >-
          Name for the buildx builder instance created for this run. Keeps
          concurrent builds on the same runner from colliding on a shared
          default builder.
        type: string
        required: true
      bake-targets:
        description: >-
          Optional override for the bake targets to build, as a JSON array
          string (e.g. '["debian"]'). Each entry becomes its own matrix
          component (no dependency-graph grouping is applied to an override,
          since the graph isn't consulted for it). If unset, the target list
          is discovered dynamically from `docker buildx bake --print`, which
          is the preferred path so a new variant is picked up without
          touching this workflow.
        type: string
        required: false
        default: ""
      verify-command:
        description: >-
          Shell command run in the `build` job's verify step, per matrix leg,
          INSTEAD of the built-in `$/.github/actions/verify-image` (imgverify)
          action. Empty (the default) means "use the built-in imgverify
          action" — the normal path for a consumer with an `.imgverify.yaml`
          manifest. A non-empty value is an escape hatch for a consumer that
          has not migrated to imgverify yet: the step appends `--digests
          <path to this leg's digest file>`, so this must name a command that
          accepts that flag directly.
        type: string
        required: false
        # NOT `task verify`. go-task treats a trailing `--digests x` as its
        # own flag and exits 2 printing usage without running the task; with
        # `--` it forwards the flag to the BUILD step instead, where bake
        # rejects it (exit 201). Both were measured. It fails closed rather
        # than passing vacuously, but it never verifies anything either.
        default: ""
      verify-manifest:
        description: >-
          Path to the imgverify manifest, passed through as `--manifest` to
          the built-in verify-image action. Only used when `verify-command`
          is empty. imgverify defaults to `.imgverify.yaml` in the working
          directory if this is left empty, which is the calling repo's
          checkout (the action runs with the caller's workspace as cwd).
        type: string
        required: false
        default: ""
      runs-on:
        description: >-
          Runner label used for every job in this workflow.
        type: string
        required: false
        default: self-hosted
      timeout-minutes:
        description: >-
          Per-job timeout in minutes, applied to build (which now includes
          per-leg verify) and publish.
        type: number
        required: false
        default: 60

# NO top-level `concurrency:` here, deliberately. Do not add one.
#
# Inside a called workflow, `github.workflow` resolves to the CALLING
# workflow's name, not this file's. So a `concurrency` block here computes
# the same group the caller's own block computes, and GitHub refuses to let
# a workflow wait on a group its own caller already holds:
#
#   Canceling since a deadlock was detected for concurrency group
#   'build-refs/heads/main' between a top level workflow and 'build'
#
# The run dies in seconds with zero jobs, so nothing builds and nothing is
# published. Declaring concurrency in both files is not redundant, it is
# fatal, and every caller that sensibly declares its own would hit it.
#
# Concurrency therefore belongs to the caller, which also lets each repo
# choose its own cancel-in-progress semantics. See README.
jobs:
  # Read the target list from the bake file (unless overridden) so a new
  # variant is picked up by the build matrix without touching CI.
  discover:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read # required to checkout the calling repo
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      bakeargs-set: ${{ steps.targets.outputs.bakeargs-set }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read targets and build args from bake file
        id: targets
        env:
          REGISTRY: ${{ inputs.registry }}
          BAKE_TARGETS_OVERRIDE: ${{ inputs.bake-targets }}
        run: |
          set -a && source buildargs.conf && set +a
          print=$(REGISTRY="$REGISTRY" docker buildx bake --print)
          {
            if [ -n "$BAKE_TARGETS_OVERRIDE" ]; then
              # No dependency graph is consulted for an override: each named
              # target becomes its own single-target component.
              echo "targets=$(jq -c '[.[] | {name: ., targets: .}]' <<<"$BAKE_TARGETS_OVERRIDE")"
            else
              # Derive the build matrix from the dependency graph instead of a
              # flat per-target list: build an undirected adjacency list from
              # the `target:` edges in `contexts`, label-propagate to a fixed
              # point to find connected components, then group targets by
              # component. A flat matrix rebuilds every dependency once per
              # dependent (e.g. a shared base target built once per leaf that
              # references it via `contexts = { x = "target:base" }`), and
              # worse, each of those redundant jobs still carries the
              # dependency's own `cache-to`, so concurrent jobs race to write
              # the same registry cache ref — last writer wins, degrading
              # every subsequent run in a way invisible in any single run's
              # logs. `name` is the component's root (the target with no
              # outgoing edges, i.e. nothing it depends on) — chosen purely so
              # job/builder names read well; it plays no role in the grouping.
              # Ported from pyck-ai/baseimages'
              # .github/scripts/build-images/discover.sh.
              echo "targets=$(jq -c '
                .target as $t
                | ($t | keys) as $nodes
                | ( [ $t | to_entries[] | .key as $from
                      | (.value.contexts // {}) | to_entries[]
                      | select(.value | startswith("target:"))
                      | {a:$from, b:(.value | ltrimstr("target:"))} ] ) as $edges
                | ( reduce $edges[] as $e ({}; .[$e.a] += [$e.b] | .[$e.b] += [$e.a]) ) as $adj
                | ( reduce $edges[] as $e ({}; .[$e.a] += 1) ) as $deps
                | ( reduce range(0; ($nodes|length)) as $_
                      ( ($nodes | map({key:., value:.}) | from_entries);
                        . as $lab
                        | reduce $nodes[] as $n ($lab;
                            .[$n] = ([ $n, .[$n] ] + [ ($adj[$n] // [])[] | $lab[.] ] | min)) )
                  ) as $label
                | $nodes | group_by($label[.])
                | map( sort as $m
                       | { name: ([ $m[] | select(($deps[.] // 0) == 0) ] | sort | .[0] // $m[0]),
                           # Newline-separated, NOT space-separated: docker/bake-action
                           # takes `targets` as a multi-value input and splits it on
                           # newlines. A space-separated list is read as one target name
                           # and fails with "failed to find target a b c".
                           targets: ($m | join("\n")) } )
                | sort_by(.name)' <<<"$print")"
            fi
            echo 'bakeargs-set<<EOF'
            grep -v '^#' buildargs.conf | grep -v '^\s*$' | sed 's/^/*.args./'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              # On PRs, disable cache export so an unmerged (possibly broken) bump can't
              # poison the registry build cache that scheduled builds rely on.
              echo '*.cache-to='
            fi
            # Push every build by digest only, on every trigger — never a floating
            # or version tag directly. Tags are applied afterwards by the `publish`
            # job, once every leg of `build` has verified its own pushed digest, so
            # a bad image never gets the chance to be reachable by `latest`. The
            # repo to push to is derived from each target's first tag (e.g. .../foo:latest).
            # Guard against targets with no tags (e.g. a future internal-only
            # target) so `.value.tags[0]` doesn't explode.
            jq -rn --argjson p "$print" '
              $p.target
              | to_entries[]
              | select((.value.tags // []) | length > 0)
              | .key as $k
              | (.value.tags[0] | sub(":[^/]+$"; "")) as $repo
              | ($k + ".tags="),
                ($k + ".output=type=image,name=" + $repo + ",push-by-digest=true,name-canonical=true,push=true")'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  build:
    needs: [discover]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # required to checkout the calling repo
      packages: write # required to push images/digests to ghcr.io
    env:
      # Hoisted to job level because `secrets` is not available in an `if:`
      # expression — the conditional login step below reads this env var
      # instead. Left unset (empty string) when the caller doesn't define the
      # secret, e.g. github-runner, which never sets Docker Hub credentials.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      # These jobs push as they go (by digest), so a cancelled sibling can be
      # interrupted after it has already pushed, leaving a half-written
      # registry cache export behind. With many components (baseimages has
      # 15) you also want to learn about every failure in one run rather than
      # one failure per run. Unobservable with a single target; important at
      # scale.
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          # Per-repo AND per-leg isolation: `builder-name` is workflow-scoped
          # and required, so with a many-component matrix every leg would
          # otherwise call `docker buildx create --name <same>` concurrently
          # on the same runner — creation conflicts, buildkit contention, and
          # setup-buildx-action's post-step `docker buildx rm` potentially
          # tearing the builder out from under a still-running sibling leg.
          # Suffixing with the component name keeps each leg's builder
          # independent.
          name: ${{ inputs.builder-name }}-${{ matrix.component.name }}
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      # Needed both to pull the base image and to push the result.
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: only some consumers (e.g. baseimages, whose Dockerfiles
      # reference `alpine`, `debian`, `golang`, `nginxinc/nginx-unprivileged`)
      # pull base images from Docker Hub. Anonymous pulls there are rate
      # limited per-IP (100/6h), and with `pull: true`, two platforms, and a
      # many-component fan-out, an unauthenticated shared self-hosted runner
      # IP can exceed that limit — surfacing as an intermittent-looking
      # network flake. A consumer that defines neither secret (e.g.
      # github-runner) simply skips this step. `secrets` isn't readable in an
      # `if:`, hence the job-level `env.DOCKERHUB_USERNAME` hop above.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          targets: ${{ matrix.component.targets }}
          # Refresh the base image so a scheduled rebuild actually picks up a new
          # floating base tag instead of a stale local one.
          pull: true
          # Always false: `push: true` maps to `--set *.output=type=registry`,
          # which would collide with the per-target `<target>.output=type=image,...`
          # that `discover` always emits (push-by-digest, every trigger, including
          # scheduled/manual runs). Letting that `set` override be the sole writer
          # of `output` avoids depending on unclear pattern-vs-exact-key precedence
          # in buildx.
          push: false
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ inputs.registry }}
          # Keep provenance out of the METADATA JSON only; the image itself still
          # gets its provenance attestation. Buildx embeds the full SLSA predicate
          # per target, and a multi-platform target's JSON can be large enough to
          # blow the step's env var out (Linux caps a single env var at
          # MAX_ARG_STRLEN = 128KB); the next step reads METADATA through the
          # environment. See docker/bake-action#239 and #135, and
          # pyck-ai/baseimages' build-images.yml which hit this for real.
          BUILDX_METADATA_PROVENANCE: disabled

      # Recorded so this leg's own verify step below can pull this exact
      # digest (not whatever a floating tag happens to point at), and so
      # `publish` can apply tags to it once every leg has verified. One JSON
      # file per matrix component (a component can bake multiple real bake
      # targets; the metadata dict below is already keyed by each real
      # target's name, so the component name here is only used to make the
      # artifact filename unique). Still uploaded as an artifact — not just
      # used locally — because `publish` runs in a separate job and needs
      # every leg's digest, merged downstream via an artifact handshake, not
      # job outputs, because matrix outputs are last-writer-wins and would
      # silently corrupt digest tracking if a variant is added.
      - name: Export digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          TARGET: ${{ matrix.component.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          jq -e 'to_entries
                 | map(select(.key != "buildx.build.warnings"
                              and (.value["containerimage.digest"]? != null)))
                 | map({key: .key, value: .value["containerimage.digest"]})
                 | from_entries
                 | if length == 0 then error("no digests in bake metadata") else . end' \
            <<<"$METADATA" > "$RUNNER_TEMP/digests/$TARGET.json"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component.name }}
          path: ${{ runner.temp }}/digests/${{ matrix.component.name }}.json
          retention-days: 1

      # Verify the EXACT digest(s) this leg just pushed — a real pre-tag gate
      # rather than a post-publish smoke test — right here in the same job,
      # instead of a separate job that waits on every leg's digest artifact.
      # Only this leg's own targets are passed via `--target`, one per real
      # bake target in `matrix.component.targets` (newline-separated; see the
      # `discover` job's comment on why that separator is load-bearing).
      # `publish` (via `needs: [discover, build]`) only runs once every leg of
      # this matrix has succeeded — so a bad image never has a chance to be
      # reachable by a floating tag. With `fail-fast: false`, a failing leg
      # doesn't stop its siblings, but it does fail this `build` job overall,
      # which is what `publish`'s `needs: build` keys off.
      #
      # Caveat: a multi-arch target's `docker pull` on the recorded digest only
      # fetches the manifest for the puller's own platform (amd64, since
      # self-hosted runners here are amd64). So this verifies the amd64 half
      # only — any arm64 half is published unverified. `--load` cannot load a
      # multi-arch result at all; pulling the real pushed digest is strictly
      # better than a fresh single-platform rebuild (it's the actual pushed
      # artifact) but does not close this platform gap. See the same note in
      # pyck-ai/baseimages' verify.sh.
      - name: Build target list for verify
        id: verify-targets
        env:
          TARGETS: ${{ matrix.component.targets }}
        run: |
          {
            echo 'args<<EOF'
            while IFS= read -r t; do
              [ -n "$t" ] && printf -- '--target\n%s\n' "$t"
            done <<<"$TARGETS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # `$/` is the self-repository reference: it resolves an action stored
      # in THIS repository at the running commit's SHA — the same SHA as
      # this workflow — with no separate checkout needed. Documented at
      # https://docs.github.com/actions/using-workflows/reusing-workflows
      # (and the composite-actions "referencing an action in the same
      # repository" section). This means a consumer pinning
      # build-image.yml@<sha> always gets the verify-image action from that
      # SAME sha — the workflow and the action can never drift apart, and no
      # self-referencing SHA needs to be hardcoded or bumped on release.
      # `$/` is unsupported on GitHub Enterprise Server; fine here since this
      # runs on github.com only. A relative `uses: ./...` would resolve
      # against the CALLER's workspace instead of this repo, and `uses:`
      # cannot take an expression, so neither alternative works here.
      - name: Verify pushed image (built-in)
        if: inputs.verify-command == ''
        uses: $/.github/actions/verify-image
        with:
          args: >-
            run
            ${{ inputs.verify-manifest != '' && format('--manifest {0}', inputs.verify-manifest) || '' }}
            ${{ steps.verify-targets.outputs.args }}
            --digests ${{ runner.temp }}/digests/${{ matrix.component.name }}.json
        env:
          REGISTRY: ${{ inputs.registry }}

      - name: Verify pushed image (custom command)
        if: inputs.verify-command != ''
        env:
          REGISTRY: ${{ inputs.registry }}
        run: ${{ inputs.verify-command }} --digests ${{ runner.temp }}/digests/${{ matrix.component.name }}.json

  # Apply the floating/version tags now that every leg of `build` has verified
  # the digest it pushed. Skipped on PRs: PR builds are pushed by digest only
  # for inspection and must never move a tag that scheduled/manual runs own.
  publish:
    needs: [discover, build]
    if: github.event_name != 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # required to checkout the calling repo
      packages: write # required to apply tags via imagetools create
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Merge digests
        run: jq -s 'add' digests/*.json > digests.json

      - name: Apply tags
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -a && source buildargs.conf && set +a
          print=$(docker buildx bake --print | jq -c '.target')
          rc=0
          while IFS=$'\t' read -r target tags; do
            d=$(jq -r --arg t "$target" '.[$t] // empty' digests.json)
            if [ -z "$d" ]; then echo "::error::no digest recorded for $target"; rc=1; continue; fi
            IFS=',' read -ra tl <<<"$tags"
            # Derive the repo the same way discover's jq does
            # (sub(":[^/]+$"; "")) so the two agree on registries with a port.
            # Do not substitute bash ${x%:*} for this reason.
            repo=$(sed 's/:[^/]*$//' <<<"${tl[0]}")
            # Assert the source is a multi-arch index rather than passing
            # --prefer-index=false: every target here is assumed to inherit a
            # shared multi-platform config, so the source IS an index and
            # `imagetools create` does a cheap carbon copy. If a target ever
            # became single-platform, --prefer-index=false would silently
            # publish a bare manifest; failing loudly here is correct instead.
            if ! docker buildx imagetools inspect --raw "${repo}@${d}" \
                 | jq -e '.mediaType|test("index|manifest.list")' >/dev/null; then
              echo "::error::$target digest is not a multi-arch index: ${repo}@${d}"; rc=1; continue
            fi
            args=(); for t in "${tl[@]}"; do args+=(-t "$t"); done
            # Accumulate failures rather than aborting on the first error, so a
            # re-run converges in one pass. imagetools create from a recorded
            # digest is idempotent.
            docker buildx imagetools create "${args[@]}" "${repo}@${d}" || rc=1
          done < <(jq -r 'to_entries[] | select((.value.tags//[])|length>0) | "\(.key)\t\(.value.tags|join(","))"' <<<"$print")
          exit $rc

  # Single aggregate gate for the branch-protection required status check.
  #
  # Renaming this job breaks every consumer: four repos' branch-protection
  # required checks reference the name "gate" directly. Do not rename it
  # without updating every caller's required-check configuration in the same
  # change.
  #
  # The build matrix can't be required directly: its targets are discovered
  # dynamically, and a matrix job skipped via a failed `needs` reports a bare
  # context that a required check treats as passing. This job has a stable
  # name, runs even when upstream jobs fail (if: always()), and fails unless
  # every one of them succeeded.
  gate:
    needs: [discover, build, publish]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    permissions: {} # aggregation only; no API calls needed
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ needs.discover.result }} ${{ needs.build.result }}"
          for r in $results; do
            [ "$r" = "success" ] || { echo "A job did not succeed: $results"; exit 1; }
          done
          # `publish` is intentionally skipped on PRs (if: github.event_name !=
          # 'pull_request'), so it must be accepted as either "success" or
          # "skipped".
          case "${{ needs.publish.result }}" in
            success|skipped) ;;
            *) echo "publish did not succeed: ${{ needs.publish.result }}"; exit 1 ;;
          esac
          echo "All jobs succeeded."
