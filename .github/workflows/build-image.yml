name: build-image

# Reusable single-image build/verify/publish workflow.
#
# Shape (must not be weakened): discover -> build+verify (matrix; each leg
# pushes BY DIGEST, no tags, then verifies the exact digest(s) it just
# pushed) -> publish (applies tags) -> gate. The property being protected: a
# bad image never gets the chance to be reachable by a floating tag. Do not
# add a mode/input that allows tagging before every leg's verify step
# completes.
#
# One leg per component AND platform. `discover` expands each component (the
# targets connected by `target:` contexts) into one leg per platform its
# targets list in the bake file, and a leg builds only that platform
# (`<target>.platform=...`). Every target of a component must list the same
# platforms, or `discover` fails naming them. A component that lists no
# platform gets one leg that builds as before. The legs exist because a leg
# that builds both platforms of a large target cold overran the 20 GiB
# BuildKit disk of the kata pool. Each leg verifies the digest it pushed only
# when its platform is the runner's native one (the others log a notice and
# skip); `publish` then creates every tag from all of a target's per-platform
# digests in one `imagetools create`, so the index holds exactly the legs'
# manifests, and still only after every leg succeeded.
#
# Build cache: each platform leg reads and writes its own registry cache
# refs, the target's `cache-from`/`cache-to` refs from the bake file with
# `-<arch>` appended (`...buildcache:alpine` -> `...buildcache:alpine-arm64`),
# so two legs never share or overwrite a ref. The first run after a repo
# adopts this is cold, as the old unsuffixed refs are no longer read. On PRs
# the export stays off. Components without platforms keep their refs.
#
# Consumers pin this workflow by commit SHA:
# pyck-ai/github-actions/.github/workflows/build-image.yml@<sha>
#
# Consumer contract: the calling repository's Taskfile.yml has a `build`
# task, and each `build` leg runs it as
#   task build TARGET="<bake targets, space-separated>" BUILDER=<builder> -- <overrides>
# where the overrides are `--pull`, `--metadata-file <path>` and one `--set`
# per line of `discover`'s bake overrides (build args, per-target push by
# digest, `*.cache-to=` on PRs) plus, on a leg with a platform, the leg's
# `<target>.platform`, `<target>.cache-from` and `<target>.cache-to`. The
# task must:
#   - take `TARGET` (one or more bake targets, default all of them) and pass
#     it to `docker buildx bake` as the targets to build;
#   - take `BUILDER` (the buildx builder name, default the task's own) and pass
#     it as `--builder`; the leg creates that builder before running the task;
#   - pass `{{.CLI_ARGS}}` through to `docker buildx bake` unchanged;
#   - add no local-only flags when `CI=true` (no host platform override, no
#     `--load`, no `--push`): plain bake pushes only through the per-target
#     `output=` overrides above.
# `task build` with no arguments builds every target locally, so the CI
# command and the local command are the same task.
#
# Runners: on a runner that ships `runner-init` (the unprivileged kata pool,
# which has no Docker daemon), each `build` leg uses the runner's rootless
# BuildKit through the buildx remote driver (`$BUILDKIT_HOST`) instead of a
# docker-container builder, skips QEMU setup because BuildKit emulates arm64
# itself, and verifies through the runner's podman socket (`$DOCKER_HOST`).
# A leg whose platform is not the runner's native one (arm64 on the amd64
# runners) skips verify, since the podman socket cannot run it natively.
# Everywhere else the legs behave as before. Callers configure nothing; the
# `Detect rootless BuildKit` step decides. The remote BuildKit is the runner's
# own, so the bake file must not need daemon-side settings such as
# `network.host` entitlements, and a bake context outside the working
# directory needs buildx's `--allow fs.read=<dir>` in the caller's `build`
# task.
#
# Triggers stay in the caller (schedule / workflow_dispatch / pull_request);
# a shared workflow must not own the cron, since the offset encodes a real
# dependency on when an upstream image publishes.

on:
  workflow_call:
    secrets:
      # Optional: enables the Docker Hub login step in `build` so callers
      # whose Dockerfiles pull Hub base images (e.g. alpine, debian, golang,
      # nginxinc/nginx-unprivileged) avoid anonymous-pull rate limiting. A
      # caller that omits both simply never logs in. Names are UPPER_SNAKE so
      # a caller's `secrets: inherit` matches them by name.
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    inputs:
      registry:
        description: >-
          Container registry + namespace to build args resolve against and
          to push images to (e.g. ghcr.io/pyck-ai). Exported as the
          REGISTRY env var consumed by the bake file.
        type: string
        required: false
        default: ghcr.io/pyck-ai
      builder-name:
        description: >-
          Name for the buildx builder instance created for this run. Keeps
          concurrent builds on the same runner from colliding on a shared
          default builder.
        type: string
        required: true
      bake-targets:
        description: >-
          Optional override for the bake targets to build, as a JSON array
          string (e.g. '["debian"]'). Each entry becomes its own matrix
          component (no dependency-graph grouping is applied to an override,
          since the graph isn't consulted for it). If unset, the target list
          is discovered dynamically from `docker buildx bake --print`, which
          is the preferred path so a new variant is picked up without
          touching this workflow.
        type: string
        required: false
        default: ""
      buildargs:
        description: >-
          Path to a buildargs.conf-style KEY=VALUE file, passed to each
          target's verify.sh via `docker run --env-file` (see
          `$/verify-image`). Optional: the action tolerates
          this file being absent, so a caller without one (e.g.
          github-runner, flutter-rfw) still works.
        type: string
        required: false
        default: buildargs.conf
      runs-on:
        description: >-
          Runner label used for every job in this workflow.
        type: string
        required: false
        default: self-hosted
      timeout-minutes:
        description: >-
          Per-job timeout in minutes, applied to build (which now includes
          per-leg verify) and publish.
        type: number
        required: false
        default: 60

# NO top-level `concurrency:` here, deliberately. Do not add one.
#
# Inside a called workflow, `github.workflow` resolves to the CALLING
# workflow's name, not this file's. So a `concurrency` block here computes
# the same group the caller's own block computes, and GitHub refuses to let
# a workflow wait on a group its own caller already holds:
#
#   Canceling since a deadlock was detected for concurrency group
#   'build-refs/heads/main' between a top level workflow and 'build'
#
# The run dies in seconds with zero jobs, so nothing builds and nothing is
# published. Declaring concurrency in both files is not redundant, it is
# fatal, and every caller that sensibly declares its own would hit it.
#
# Concurrency therefore belongs to the caller, which also lets each repo
# choose its own cancel-in-progress semantics.
jobs:
  # Read the target list from the bake file (unless overridden) so a new
  # variant is picked up by the build matrix without touching CI.
  discover:
    runs-on: ${{ inputs.runs-on }}
    # Reads the bake file and computes the matrix; observed well under a
    # minute in practice. Generous headroom over that, and still a small
    # fraction of the 360-minute default, so a hung runner fails fast
    # instead of holding a concurrency slot for hours.
    timeout-minutes: 10
    permissions:
      contents: read # required to checkout the calling repo
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      bakeargs-set: ${{ steps.targets.outputs.bakeargs-set }}
      contexts: ${{ steps.targets.outputs.contexts }}
      caches: ${{ steps.targets.outputs.caches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read targets and build args from bake file
        id: targets
        env:
          REGISTRY: ${{ inputs.registry }}
          BAKE_TARGETS_OVERRIDE: ${{ inputs.bake-targets }}
        run: |
          set -a && source buildargs.conf && set +a
          print=$(REGISTRY="$REGISTRY" docker buildx bake --print)
          if [ -n "$BAKE_TARGETS_OVERRIDE" ]; then
            # No dependency graph is consulted for an override: each named
            # target becomes its own single-target component.
            components=$(jq -c '[.[] | {name: ., targets: .}]' <<<"$BAKE_TARGETS_OVERRIDE")
          else
            # Derive the build matrix from the dependency graph instead of a
            # flat per-target list: build an undirected adjacency list from
            # the `target:` edges in `contexts`, label-propagate to a fixed
            # point to find connected components, then group targets by
            # component. A flat matrix rebuilds every dependency once per
            # dependent (e.g. a shared base target built once per leaf that
            # references it via `contexts = { x = "target:base" }`), and
            # worse, each of those redundant jobs still carries the
            # dependency's own `cache-to`, so concurrent jobs race to write
            # the same registry cache ref; last writer wins, degrading
            # every subsequent run in a way invisible in any single run's
            # logs. `name` is the component's root (the target with no
            # outgoing edges, i.e. nothing it depends on); chosen purely so
            # job/builder names read well; it plays no role in the grouping.
            # Ported from pyck-ai/baseimages'
            # .github/scripts/build-images/discover.sh.
            components=$(jq -c '
              .target as $t
              | ($t | keys) as $nodes
              | ( [ $t | to_entries[] | .key as $from
                    | (.value.contexts // {}) | to_entries[]
                    | select(.value | startswith("target:"))
                    | {a:$from, b:(.value | ltrimstr("target:"))} ] ) as $edges
              | ( reduce $edges[] as $e ({}; .[$e.a] += [$e.b] | .[$e.b] += [$e.a]) ) as $adj
              | ( reduce $edges[] as $e ({}; .[$e.a] += 1) ) as $deps
              | ( reduce range(0; ($nodes|length)) as $_
                    ( ($nodes | map({key:., value:.}) | from_entries);
                      . as $lab
                      | reduce $nodes[] as $n ($lab;
                          .[$n] = ([ $n, .[$n] ] + [ ($adj[$n] // [])[] | $lab[.] ] | min)) )
                ) as $label
              | $nodes | group_by($label[.])
              | map( sort as $m
                     | { name: ([ $m[] | select(($deps[.] // 0) == 0) ] | sort | .[0] // $m[0]),
                         # Newline-separated: verify-image splits `targets` on
                         # newlines, and a space-separated list there is read as
                         # one target name. The build step turns the newlines into
                         # the spaces `task build TARGET=` takes.
                         targets: ($m | join("\n")) } )
              | sort_by(.name)' <<<"$print")
          fi
          # One matrix leg per component and platform: a leg that built both
          # platforms of a large target cold overran the 20 GiB BuildKit disk
          # of the unprivileged kata pool, so each leg builds one platform. A
          # component's platforms are its targets' `platforms` from the bake
          # file, and every target of a component must list the same ones
          # (the leg builds all of its targets for one platform). A component
          # whose targets list no platform gets a single leg with an empty
          # `platform` and `arch`, which builds as before (no platform
          # override, unchanged cache refs). `arch` is the platform without
          # its `linux/` prefix and with `/` as `-` (`linux/arm/v7` ->
          # `arm-v7`), so it is safe in job, builder and artifact names. This
          # runs outside the `{ ... } >> "$GITHUB_OUTPUT"` group below
          # because a failing command substitution inside `echo` would not
          # fail the step.
          if ! matrix=$(jq -c --argjson p "$print" '
                [ .[] | . as $c
                  | ($c.targets | split("\n") | map(select(. != ""))) as $ts
                  | ([ $ts[] | ($p.target[.].platforms // []) | sort ] | unique) as $sets
                  | if ($sets | length) > 1 then
                      error("targets of component " + $c.name + " list different platforms: "
                            + ([ $ts[] | . + "=[" + (($p.target[.].platforms // []) | join(",")) + "]" ] | join(" ")))
                    else . end
                  | ($sets[0] // []) as $plats
                  | if ($plats | length) == 0 then
                      $c + {platform: "", arch: ""}
                    else
                      $plats[] | {name: $c.name, targets: $c.targets, platform: .,
                                  arch: (sub("^linux/"; "") | gsub("/"; "-"))}
                    end ]' <<<"$components" 2>&1); then
            echo "::error::$matrix"
            exit 1
          fi
          {
            echo "targets=$matrix"
            # Per-real-target lookup consumed by `build`'s verify step: each
            # bake target's own `context` dir (where its `verify.sh` lives,
            # per the `$/verify-image` contract) and the repo
            # its digest lives under (same derivation as the push output
            # below, so the two always agree). Keyed by the real bake target
            # name, not the matrix component name, since one component can
            # bake several real targets (e.g. baseimages' alpine/debian
            # dependency chains) and each needs its own verify.sh run.
            echo "contexts=$(jq -cn --argjson p "$print" '
              [ $p.target | to_entries[]
                | select((.value.tags // []) | length > 0)
                | { key: .key,
                    value: { context: (.value.context // "."),
                             repo: (.value.tags[0] | sub(":[^/]+$"; "")) } } ]
              | from_entries')"
            # Per-real-target cache refs as the bake file declares them, for
            # `build` to suffix with each leg's arch (see the `Build and push`
            # step). `bake --print` prints them as objects (`{type, ref,
            # mode}`); a string form (`type=registry,ref=...`) is passed
            # through and handled by `build` too.
            echo "caches=$(jq -cn --argjson p "$print" '
              [ $p.target | to_entries[]
                | select((.value["cache-from"] // []) + (.value["cache-to"] // []) | length > 0)
                | { key: .key,
                    value: { from: (.value["cache-from"] // []),
                             to: (.value["cache-to"] // []) } } ]
              | from_entries')"
            echo 'bakeargs-set<<EOF'
            grep -v '^#' buildargs.conf | grep -v '^\s*$' | sed 's/^/*.args./'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              # On PRs, disable cache export so an unmerged (possibly broken) bump can't
              # poison the registry build cache that scheduled builds rely on.
              echo '*.cache-to='
            fi
            # Push every build by digest only, on every trigger; never a floating
            # or version tag directly. Tags are applied afterwards by the `publish`
            # job, once every leg of `build` has verified its own pushed digest, so
            # a bad image never gets the chance to be reachable by `latest`. The
            # repo to push to is derived from each target's first tag (e.g. .../foo:latest).
            # Guard against targets with no tags (e.g. a future internal-only
            # target) so `.value.tags[0]` doesn't explode.
            jq -rn --argjson p "$print" '
              $p.target
              | to_entries[]
              | select((.value.tags // []) | length > 0)
              | .key as $k
              | (.value.tags[0] | sub(":[^/]+$"; "")) as $repo
              | ($k + ".tags="),
                ($k + ".output=type=image,name=" + $repo + ",push-by-digest=true,name-canonical=true,push=true")'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [discover]
    name: build ${{ matrix.component.name }}${{ matrix.component.arch && format(' {0}', matrix.component.arch) || '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # required to checkout the calling repo
      packages: write # required to push images/digests to ghcr.io
    env:
      # Hoisted to job level because `secrets` is not available in an `if:`
      # expression; the conditional login step below reads this env var
      # instead. Left unset (empty string) when the caller doesn't define the
      # secret, e.g. github-runner, which never sets Docker Hub credentials.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # This leg's buildx builder: per repo, component and platform (see the
      # `Set up buildx builder` comment). No arch suffix when the component
      # lists no platforms.
      BUILDER_NAME: ${{ inputs.builder-name }}-${{ matrix.component.name }}${{ matrix.component.arch && format('-{0}', matrix.component.arch) || '' }}
      # This leg's identity for its digest file and artifact: the component,
      # plus the arch when the component lists platforms.
      LEG: ${{ matrix.component.name }}${{ matrix.component.arch && format('-{0}', matrix.component.arch) || '' }}
    strategy:
      # These jobs push as they go (by digest), so a cancelled sibling can be
      # interrupted after it has already pushed, leaving a half-written
      # registry cache export behind. With many components (baseimages has
      # 15) you also want to learn about every failure in one run rather than
      # one failure per run. Unobservable with a single target; important at
      # scale.
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> "$GITHUB_ENV"

      # Pick the builder. The unprivileged kata runner pool has no Docker
      # daemon and cannot register binfmt handlers; its image instead ships
      # `runner-init`, which starts a rootless BuildKit (with BuildKit's own
      # arm64 emulators) and a podman socket for the docker CLI. The presence
      # of `runner-init` is the only signal used, so every other runner (the
      # dind pool, GitHub-hosted runners) keeps the docker-container path
      # below untouched. `remote=true` needs BuildKit to actually be ready
      # (`--wait` exits 0 only then); a runner-init that never gets there is
      # a pool fault, so it is flagged with a warning before the docker-
      # container path below fails for lack of a daemon.
      - name: Detect rootless BuildKit
        id: buildkit
        run: |
          remote=false
          if command -v runner-init >/dev/null 2>&1; then
            if runner-init --wait buildkit 180; then
              remote=true
            else
              echo "::warning::runner-init is present but rootless BuildKit did not become ready within 180s"
            fi
          fi
          echo "remote=$remote" >> "$GITHUB_OUTPUT"

      # QEMU/binfmt registration needs privileges the unprivileged pool does
      # not have, and is unnecessary there: the runner's BuildKit emulates
      # arm64 `RUN` steps itself.
      - name: Set up QEMU
        if: steps.buildkit.outputs.remote != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up buildx builder
        if: steps.buildkit.outputs.remote != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Per-repo AND per-leg isolation: `builder-name` is workflow-scoped
          # and required, so with a many-component matrix every leg would
          # otherwise call `docker buildx create --name <same>` concurrently
          # on the same runner; creation conflicts, buildkit contention, and
          # setup-buildx-action's post-step `docker buildx rm` potentially
          # tearing the builder out from under a still-running sibling leg.
          # Suffixing with the component name and platform keeps each leg's
          # builder independent.
          name: ${{ env.BUILDER_NAME }}
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      # Same builder name as above, so `task build BUILDER=...` and everything
      # after it is unchanged. A plain `docker buildx create` instead of
      # setup-buildx-action: the remote driver takes no `network=host` or
      # buildkitd flags (the daemon is the runner's, already running), and
      # nothing here needs the action's docker-container bootstrap or its
      # post-step builder removal; the builder record lives in the pod's
      # ~/.docker and dies with the pod. `--bootstrap` fails the step early if
      # the socket is not reachable. Registry credentials need no wiring: the
      # buildx client sends them to BuildKit from ~/.docker/config.json
      # (written by the login steps below) for each build.
      - name: Set up buildx builder (remote rootless BuildKit)
        if: steps.buildkit.outputs.remote == 'true'
        env:
          BUILDER: ${{ env.BUILDER_NAME }}
        run: |
          docker buildx create --name "$BUILDER" --driver remote --use \
            "${BUILDKIT_HOST:?runner-init is present but BUILDKIT_HOST is not set}"
          docker buildx inspect "$BUILDER" --bootstrap

      # `verify-image` below uses `docker build` and `docker run`, which on
      # this pool talk to runner-init's podman socket (DOCKER_HOST), not a
      # Docker daemon. Wait here, before anything needs it, so a socket that
      # is slow to come up fails this step instead of the verify step after a
      # long build.
      - name: Wait for the podman socket
        if: steps.buildkit.outputs.remote == 'true'
        run: runner-init --wait podman 120

      # Needed both to pull the base image and to push the result.
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: only some consumers (e.g. baseimages, whose Dockerfiles
      # reference `alpine`, `debian`, `golang`, `nginxinc/nginx-unprivileged`)
      # pull base images from Docker Hub. Anonymous pulls there are rate
      # limited per-IP (100/6h), and with `--pull`, two platforms, and a
      # many-component fan-out, an unauthenticated shared self-hosted runner
      # IP can exceed that limit; surfacing as an intermittent-looking
      # network flake. A consumer that defines neither secret (e.g.
      # github-runner) simply skips this step. `secrets` isn't readable in an
      # `if:`, hence the job-level `env.DOCKERHUB_USERNAME` hop above.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      # The leg runs the CALLER's `task build`, so the same command builds
      # locally and in CI (the consumer contract is in the header above).
      # Everything bake-action used to pass goes after `--` as bake overrides:
      #   --pull                  refresh the base image so a scheduled rebuild
      #                           picks up a new floating base tag instead of a
      #                           stale local one.
      #   --set <line> ...        one per line of discover's `bakeargs-set`:
      #                           the buildargs, `*.cache-to=` on PRs, and the
      #                           per-target `<target>.output=type=image,...,
      #                           push-by-digest=true` that pushes every build
      #                           by digest only, on every trigger. Plain bake
      #                           never pushes by itself, so no `--push` here:
      #                           it would map to `--set *.output=type=registry`
      #                           and collide with those per-target outputs.
      #   --metadata-file <path>  where the digests are read from below.
      # `task` re-quotes `{{.CLI_ARGS}}` for the shell, so a `--set` value with
      # spaces or quotes reaches bake as one argument. TARGET is the leg's real
      # bake targets, space-separated (discover emits them newline-separated).
      - name: Build and push
        env:
          REGISTRY: ${{ inputs.registry }}
          TARGETS: ${{ matrix.component.targets }}
          BUILDER: ${{ env.BUILDER_NAME }}
          BAKEARGS_SET: ${{ needs.discover.outputs.bakeargs-set }}
          PLATFORM: ${{ matrix.component.platform }}
          ARCH: ${{ matrix.component.arch }}
          CACHES: ${{ needs.discover.outputs.caches }}
          EVENT_NAME: ${{ github.event_name }}
          # Keep provenance out of the METADATA JSON only; the image itself still
          # gets its provenance attestation. Buildx embeds the full SLSA predicate
          # per target, and a multi-platform target's JSON can be large; see
          # docker/bake-action#239 and #135, and pyck-ai/baseimages'
          # build-images.yml which hit this for real.
          BUILDX_METADATA_PROVENANCE: disabled
        run: |
          overrides=(--pull --metadata-file "$RUNNER_TEMP/bake-meta.json")
          while IFS= read -r line; do
            if [ -n "$line" ]; then overrides+=(--set "$line"); fi
          done <<<"$BAKEARGS_SET"
          # A leg with a platform builds only that platform of each of its
          # targets, and reads and writes its own cache refs: the target's
          # refs from the bake file with `-<arch>` appended, so two platform
          # legs never share or overwrite a ref. Their first run is cold. On
          # PRs `*.cache-to=` (above) already disables the export. A leg
          # without a platform changes nothing.
          if [ -n "$PLATFORM" ]; then
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              overrides+=(--set "$t.platform=$PLATFORM")
              while IFS= read -r line; do
                if [ -n "$line" ]; then overrides+=(--set "$t.$line"); fi
              done < <(jq -r --arg t "$t" --arg arch "$ARCH" --arg event "$EVENT_NAME" '
                def sfx:
                  if type == "string" then sub("ref=(?<r>[^,]+)"; "ref=" + .r + "-" + $arch)
                  else
                    (if has("ref") then .ref += "-" + $arch else . end)
                    | ([ .type // empty | "type=" + . ]
                       + [ to_entries[] | select(.key != "type") | "\(.key)=\(.value)" ] | join(","))
                  end;
                .[$t] // empty
                | (.from | map(sfx) | map("cache-from=" + .)[]),
                  (if $event == "pull_request" then empty else .to | map(sfx) | map("cache-to=" + .)[] end)' <<<"$CACHES")
            done <<<"$TARGETS"
          fi
          task build TARGET="$(paste -sd' ' <<<"$TARGETS")" BUILDER="$BUILDER" -- "${overrides[@]}"

      # Recorded so this leg's own verify step below can pull this exact
      # digest (not whatever a floating tag happens to point at), and so
      # `publish` can apply tags to it once every leg has verified. One JSON
      # file per matrix leg, i.e. per component and platform (a component can
      # bake multiple real bake targets; the metadata dict below is already
      # keyed by each real target's name, so the leg name here is only used
      # to make the artifact filename unique). Still uploaded as an artifact, not just
      # used locally, because `publish` runs in a separate job and needs
      # every leg's digest, merged downstream via an artifact handshake, not
      # job outputs, because matrix outputs are last-writer-wins and would
      # silently corrupt digest tracking if a variant is added.
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          jq -e 'to_entries
                 | map(select(.key != "buildx.build.warnings"
                              and (.value["containerimage.digest"]? != null)))
                 | map({key: .key, value: .value["containerimage.digest"]})
                 | from_entries
                 | if length == 0 then error("no digests in bake metadata") else . end' \
            "$RUNNER_TEMP/bake-meta.json" > "$RUNNER_TEMP/digests/$LEG.json"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ env.LEG }}
          path: ${{ runner.temp }}/digests/${{ env.LEG }}.json
          retention-days: 1

      # Verify the EXACT digest(s) this leg just pushed; a real pre-tag gate
      # rather than a post-publish smoke test; right here in the same job,
      # instead of a separate job that waits on every leg's digest artifact.
      # Every real bake target in `matrix.component.targets` (newline-
      # separated; see the `discover` job's comment on why that separator is
      # load-bearing) gets its own `verify.sh` run, not just the first; a
      # component can bake several (e.g. baseimages' alpine dependency chain
      # bakes 7 targets in one leg). `publish` (via `needs: [discover,
      # build]`) only runs once every leg of this matrix has succeeded, so a
      # bad image never has a chance to be reachable by a floating tag. With
      # `fail-fast: false`, a failing leg doesn't stop its siblings, but it
      # does fail this `build` job overall, which is what `publish`'s `needs:
      # build` keys off.
      #
      # Platform: a leg pushes one platform, but the digest it recorded can
      # still be an index (provenance attestations make it one), and
      # `docker pull` on an index fetches only the manifest for the puller's
      # own platform. So a leg verifies its digest only when its platform is
      # the runner's native one (or the component lists no platform, which
      # builds as before and verifies the amd64 half of a multi-arch index on
      # the amd64 runners here). A leg of another platform cannot run its
      # image without emulation, so it skips verify with a notice and its
      # image is published unverified, as the arm64 half was before. `--load`
      # cannot load a multi-arch result at all; pulling the real pushed
      # digest is strictly better than a fresh single-platform rebuild (it's
      # the actual pushed artifact). See the same note in pyck-ai/baseimages'
      # verify.sh.
      - name: Check the runner can run this leg's platform
        id: native
        env:
          PLATFORM: ${{ matrix.component.platform }}
        run: |
          native=
          case "$(uname -m)" in
            x86_64) native=linux/amd64 ;;
            aarch64 | arm64) native=linux/arm64 ;;
          esac
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "$native" ]; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping verify: this leg built $PLATFORM and the runner is ${native:-$(uname -m)}, which cannot run it without emulation; the image is published unverified"
          fi

      # `$/` is the self-repository reference: it resolves an action stored
      # in THIS repository at the running commit's SHA; the same SHA as
      # this workflow, with no separate checkout needed. Documented at
      # https://docs.github.com/actions/using-workflows/reusing-workflows
      # (composite-actions "referencing an action in the same repository"),
      # and already proven in production by `tidy-ghcr.yml`'s
      # `uses: $/ghcr-tidy`. This means a consumer pinning
      # build-image.yml@<sha> always gets the verify-image action from that
      # SAME sha; the workflow and the action can never drift apart, and no
      # self-referencing SHA needs to be hardcoded or bumped on release.
      # `$/` is unsupported on GitHub Enterprise Server; fine here since this
      # runs on github.com only.
      #
      # `uses:` steps are static YAML and cannot be looped at runtime, so the
      # per-target loop lives INSIDE the action's run.sh instead of here: it
      # is handed every real target this leg built (newline-separated,
      # `matrix.component.targets`), the discover job's target -> {context,
      # repo} map, and this leg's own digest file, and verifies each one,
      # failing if any fail.
      - name: Verify pushed images
        if: steps.native.outputs.verify == 'true'
        uses: $/verify-image
        with:
          targets: ${{ matrix.component.targets }}
          contexts: ${{ needs.discover.outputs.contexts }}
          digests: ${{ runner.temp }}/digests/${{ env.LEG }}.json
          buildargs: ${{ inputs.buildargs }}
          # On the kata pool the podman socket cannot run buildx's default
          # docker-container builder (podman's pidns=host refuses its init),
          # so a shell-less target's derived busybox image is built on this
          # leg's remote builder instead. Empty elsewhere: plain docker build.
          builder: ${{ steps.buildkit.outputs.remote == 'true' && env.BUILDER_NAME || '' }}

  # Apply the floating/version tags now that every leg of `build` has verified
  # the digest it pushed. Skipped on PRs: PR builds are pushed by digest only
  # for inspection and must never move a tag that scheduled/manual runs own.
  publish:
    needs: [discover, build]
    if: github.event_name != 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # required to checkout the calling repo
      packages: write # required to apply tags via imagetools create
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # Each leg's file maps target -> digest for ONE platform of its component.
      # Merge them into target -> [digest, ...], one digest per platform leg.
      - name: Merge digests
        run: |
          jq -s 'reduce .[] as $leg ({};
                   reduce ($leg | keys[]) as $t (.; .[$t] += [$leg[$t]]))' \
            digests/*.json > digests.json

      - name: Apply tags
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -a && source buildargs.conf && set +a
          print=$(docker buildx bake --print | jq -c '.target')
          rc=0
          while IFS=$'\t' read -r target tags; do
            mapfile -t ds < <(jq -r --arg t "$target" '.[$t] // [] | .[]' digests.json)
            if [ "${#ds[@]}" -eq 0 ]; then echo "::error::no digest recorded for $target"; rc=1; continue; fi
            # One digest per platform leg, so the count must equal the
            # platforms the bake file lists for this target (one leg when it
            # lists none). A mismatch means a platform was not built, and
            # tagging would publish an incomplete index.
            want=$(jq -r --arg t "$target" '.[$t].platforms // [] | length | if . == 0 then 1 else . end' <<<"$print")
            if [ "${#ds[@]}" -ne "$want" ]; then
              echo "::error::$target has ${#ds[@]} digest(s) but the bake file lists $want platform(s)"; rc=1; continue
            fi
            IFS=',' read -ra tl <<<"$tags"
            # Derive the repo the same way discover's jq does
            # (sub(":[^/]+$"; "")) so the two agree on registries with a port.
            # Do not substitute bash ${x%:*} for this reason.
            repo=$(sed 's/:[^/]*$//' <<<"${tl[0]}")
            # Each source is one leg's pushed digest: a bare manifest, or an
            # index when provenance attestations are attached. Assert it
            # exists and is one of those, rather than letting
            # `imagetools create` fail halfway through the tag list.
            srcs=(); ok=true
            for d in "${ds[@]}"; do
              if ! docker buildx imagetools inspect --raw "${repo}@${d}" \
                   | jq -e '.mediaType|test("index|manifest")' >/dev/null; then
                echo "::error::$target digest is not an image manifest or index: ${repo}@${d}"; ok=false
              fi
              srcs+=("${repo}@${d}")
            done
            if ! $ok; then rc=1; continue; fi
            args=(); for t in "${tl[@]}"; do args+=(-t "$t"); done
            # All platforms' digests go into ONE call, so every tag points at
            # one index holding exactly the legs' manifests. Accumulate
            # failures rather than aborting on the first error, so a re-run
            # converges in one pass. imagetools create from recorded digests
            # is idempotent.
            docker buildx imagetools create "${args[@]}" "${srcs[@]}" || rc=1
          done < <(jq -r 'to_entries[] | select((.value.tags//[])|length>0) | "\(.key)\t\(.value.tags|join(","))"' <<<"$print")
          exit $rc

  # Single aggregate gate for the branch-protection required status check.
  #
  # Renaming this job breaks every consumer: four repos' branch-protection
  # required checks reference the name "gate" directly. Do not rename it
  # without updating every caller's required-check configuration in the same
  # change.
  #
  # The build matrix can't be required directly: its targets are discovered
  # dynamically, and a matrix job skipped via a failed `needs` reports a bare
  # context that a required check treats as passing. This job has a stable
  # name, runs even when upstream jobs fail (if: always()), and fails unless
  # every one of them succeeded.
  gate:
    needs: [discover, build, publish]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    # Pure `needs.*.result` aggregation, no checkout, no API calls;
    # observed well under a minute. Kept small so a hung runner is
    # reported quickly rather than holding the required check open.
    timeout-minutes: 10
    permissions: {} # aggregation only; no API calls needed
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ needs.discover.result }} ${{ needs.build.result }}"
          for r in $results; do
            [ "$r" = "success" ] || { echo "A job did not succeed: $results"; exit 1; }
          done
          # `publish` is intentionally skipped on PRs (if: github.event_name !=
          # 'pull_request'), so it must be accepted as either "success" or
          # "skipped".
          case "${{ needs.publish.result }}" in
            success|skipped) ;;
            *) echo "publish did not succeed: ${{ needs.publish.result }}"; exit 1 ;;
          esac
          echo "All jobs succeeded."
