name: tidy-ghcr

# Reusable GHCR retention workflow: wraps the `ghcr-tidy` CLI (see the
# `ghcr-tidy` entry in this repo's README for the model it implements —
# reachability-based delete set, grace window, breaker, volume alarm, canary
# and post-apply verification). Callers own the trigger (schedule /
# workflow_dispatch) — see tidy-repo.yml's header for the same rule and why
# a shared workflow must not own the cron.
#
# This workflow only PUBLISHES the capability. Nothing in this repo wires it
# into a consumer or arms a schedule; rollout is a deliberate, separate step
# per consuming repo.

on:
  workflow_call:
    inputs:
      apply:
        description: >-
          If true, actually delete planned versions. If false (the
          default), only plan and report — nothing is deleted. On a
          `schedule` trigger the `inputs` context is EMPTY and this default
          does not apply (see the `apply-effective` step below for how
          that is handled); dispatch runs use this value directly.
        type: boolean
        required: false
        default: false
      budget:
        description: >-
          Maximum number of version-deletion attempts this run may make
          (required for `apply` to do anything; ignored for plan-only
          runs). Must be a non-negative integer if set — validated in the
          `Validate string inputs` step below, which fails the run early
          rather than let a malformed value reach the CLI. `type: string`
          (not `number`): every caller value ends up as a shell argv
          string for the `ghcr-tidy` CLI's own `--budget` flag anyway, so
          the conversion belongs here rather than forcing every caller
          through `fromJSON()`. Same "schedule inputs are empty" caveat as
          `apply` — see the `apply-effective` step.
        type: string
        required: false
        default: "200"
      delete-broken-roots:
        description: >-
          Opt-in remediation for a keep-root whose subtree contains a
          PROVEN not-found descendant (a confirmed registry 404, e.g. an
          already-garbage-collected multi-arch child) — see the
          `ghcr-tidy` CLI's `--delete-broken-roots` flag and
          `plan.ts`'s `computeReachabilityToleratingBrokenRoots`.
          Deleting such a root still requires `apply: true` as well — two
          independent gestures, same posture as `apply` itself — and this
          input is DELIBERATELY, UNCONDITIONALLY forced off on a
          `schedule` trigger regardless of its configured value (see the
          `apply-effective` step below): an unattended destructive mode
          is exactly the wrong default for a cron. `workflow_dispatch`
          only.
        type: boolean
        required: false
        default: false
      package:
        description: >-
          Restrict this run to one configured package (matches a
          `packages[].match` entry in the manifest). Empty means every
          configured package.
        type: string
        required: false
        default: ""
      manifest:
        description: Path to the `.ghcr-tidy.yaml` config manifest in the caller's repo.
        type: string
        required: false
        default: .ghcr-tidy.yaml
      baseline:
        description: >-
          Trailing baseline for the volume alarm: `apply` refuses to run
          when the plan deletes more than a configurable multiple (see the
          CLI's own default) of this many versions. Leave empty (the
          default) to disable the volume alarm for this call — an empty
          `baseline` here means the `--baseline` flag is omitted entirely
          from the CLI invocation below, never passed as `0` (which would
          instead mean "refuse any plan that deletes anything"; there is
          no other way to express "off" once the input is a plain string,
          so this omission happens in the run steps below rather than via
          a workflow_call default). `type: string`, same reasoning as
          `budget` above. Must be a non-negative integer if set —
          validated in the `Validate string inputs` step below.
        type: string
        required: false

# NO top-level `concurrency:` here, deliberately — see tidy-repo.yml's
# identical comment and this repo's README. Inside a called workflow
# `github.workflow` resolves to the CALLING workflow's name, so a block
# here computes the same group the caller's own block computes and GitHub
# kills the run with zero jobs. Concurrency belongs to the caller, which
# should set `cancel-in-progress: false` — a half-finished prune (deletions
# attempted, budget partially spent) is worse than none.
jobs:
  tidy:
    name: Plan / apply GHCR retention
    runs-on: self-hosted
    timeout-minutes: 180
    # `contents: read` to check out the caller's manifest.
    # `packages: write` to plan AND delete versions via GITHUB_TOKEN. GitHub
    # automatically grants a repository admin on any package it publishes,
    # and every package this workflow prunes is repo-linked to its
    # publishing workflow, so GITHUB_TOKEN with `packages: write` can
    # delete it. Proved by direct experiment: a throwaway package published
    # from a workflow was deleted using only `secrets.GITHUB_TOKEN`
    # (DELETE .../versions/{id} -> 400 "cannot delete the last tagged
    # version", a documented constraint, not an auth failure; DELETE
    # .../packages/container/<name> -> 204). `read` alone plans but cannot
    # delete. A package that is NOT repo-linked to the caller (should one
    # ever be added to a manifest) now fails that deletion loudly with a
    # 403, recorded as a failed attempt with its group abandoned, rather
    # than the old hard failure at workflow start.
    # `issues: write` because the breaker (mandatory on the apply path,
    # see ghcr-tidy/breaker.ts) opens/comments on a labelled issue in THIS
    # repo (the caller) the moment post-apply verification finds a
    # regression, and checks for that issue before every apply run.
    permissions:
      contents: read
      packages: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `budget`/`baseline` are `type: string` (see their input docs
      # above), so nothing stops a caller from passing something that
      # isn't a number at all. Fail loudly here, before either value ever
      # reaches a CLI flag or a later step's arithmetic, rather than let
      # it surface as a confusing `ghcr-tidy` usage error or an empty/NaN
      # budget deep inside the apply path. Empty is valid for both (it
      # means "use the schedule default" for `budget`, "disable the
      # volume alarm" for `baseline` — see the `apply-effective` step and
      # the `Apply` step's `--baseline` construction respectively).
      - name: Validate string inputs
        run: |
          validate() {
            name="$1"
            value="$2"
            [ -z "$value" ] && return 0
            case "$value" in
              *[!0-9]*)
                echo "::error::\`$name\` must be a non-negative integer if set, got: $value" >&2
                exit 1
                ;;
            esac
          }
          validate budget "${{ inputs.budget }}"
          validate baseline "${{ inputs.baseline }}"

      # On a `schedule` event the `inputs` context is EMPTY (not merely
      # defaulted) — GitHub does not evaluate `workflow_call` input
      # defaults for schedule-triggered runs of the CALLER, so
      # `inputs.apply` and `inputs.budget` read as empty string there, and
      # `${{ inputs.apply || 'true' }}`-style fallback COERCES an explicit
      # `apply: false` dispatch into `true` — false is falsy in Actions
      # expressions, so `||` treats it exactly like "unset". Each
      # expression below tests `github.event_name == 'schedule'` directly
      # instead of ever treating an empty/false input as "use the
      # default"; only a genuine `schedule` run gets the hardcoded
      # schedule defaults, and only a real dispatch input is trusted
      # otherwise.
      #
      # `delete-broken-roots` follows the SAME pattern but with the
      # opposite schedule default: a `schedule` run is forced to `false`
      # unconditionally (never `inputs.delete-broken-roots`, whatever it
      # was configured to) — see this input's own doc above for why an
      # unattended destructive mode must never be the cron's default.
      - name: Resolve effective apply/budget/delete-broken-roots
        id: effective
        run: |
          {
            echo "apply=${{ github.event_name == 'schedule' || inputs.apply == true }}"
            echo "budget=${{ (github.event_name == 'schedule' && 200) || inputs.budget }}"
            echo "delete-broken-roots=${{ github.event_name != 'schedule' && inputs.delete-broken-roots == true }}"
          } >> "$GITHUB_OUTPUT"

      - name: Plan
        if: steps.effective.outputs.apply != 'true'
        uses: $/ghcr-tidy
        with:
          args: >-
            plan
            --manifest ${{ inputs.manifest }}
            --out ghcr-tidy-plan.json
            --journal ghcr-tidy-journal.ndjson
            ${{ inputs.package != '' && format('--package {0}', inputs.package) || '' }}
            ${{ steps.effective.outputs.delete-broken-roots == 'true' && '--delete-broken-roots' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply
        if: steps.effective.outputs.apply == 'true'
        uses: $/ghcr-tidy
        with:
          args: >-
            apply --apply
            --budget ${{ steps.effective.outputs.budget }}
            --manifest ${{ inputs.manifest }}
            --out ghcr-tidy-plan.json
            --journal ghcr-tidy-journal.ndjson
            --breaker-repo ${{ github.repository }}
            ${{ inputs.baseline != '' && format('--baseline {0}', inputs.baseline) || '' }}
            ${{ inputs.package != '' && format('--package {0}', inputs.package) || '' }}
            ${{ steps.effective.outputs.delete-broken-roots == 'true' && '--delete-broken-roots' || '' }}
        env:
          # A single `secrets.GITHUB_TOKEN`, scoped by this job's own
          # `permissions:` block above (`packages: write` for the registry
          # API, `issues: write` for the breaker), covers both. No
          # `GHCR_TIDY_BREAKER_TOKEN` is set, so `cli.ts`'s
          # `resolveBreakerToken` falls back to the registry token itself,
          # its documented last-resort precedence. That is safe ONLY
          # because this token carries issues access too: a registry-only
          # token would fail the breaker with a bare 404, since GitHub
          # answers 404 rather than 403 for a token lacking issue scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uploaded `if: always()` so a failed, aborted, or breaker-tripped run
      # still leaves its forensic record — the plan shows exactly what was
      # decided and the journal shows exactly what was attempted, which is
      # what a human needs to diagnose a trip without re-running anything.
      - name: Upload plan and journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghcr-tidy-plan-${{ github.run_id }}
          path: |
            ghcr-tidy-plan.json
            ghcr-tidy-journal.ndjson
          if-no-files-found: ignore
          retention-days: 30
